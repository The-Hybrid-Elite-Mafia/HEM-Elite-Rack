name: Windows build

# Manual only (Actions tab -> Windows build -> Run workflow): every run uses build minutes.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build, test, screenshots, installer, release
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Toolchain
        run: >
          tools\ci\run-and-report.ps1 -Title "toolchain" -Exe pwsh
          -ArgList '-NoProfile','-Command','cmake --version; & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion; (Get-CimInstance Win32_Processor).Name; git -C external/HybridCore log -1 --oneline'

      - name: Steinberg ASIO SDK (from Steinberg, SHA-512 checked; used under its GPLv3 option, never committed)
        run: |
          tools\ci\run-and-report.ps1 -Title "asio sdk" -Exe pwsh -ArgList '-NoProfile','-File','external\HybridCore\tools\fetch-asio-sdk.ps1'

      - name: Configure (ASIO + WASAPI + VST3)
        run: |
          tools\ci\run-and-report.ps1 -Title "configure" -Exe cmake -ArgList '--preset','rack'

      - name: Build Release (Steinberg's validator runs after the plug-in links)
        run: |
          tools\ci\run-and-report.ps1 -Title "build" -Exe cmake -ArgList '--build','--preset','rack-release' -WarningSummary

      - name: Unit tests
        run: |
          tools\ci\run-and-report.ps1 -Title "unit tests" -Exe ctest -ArgList '--test-dir','build/rack','-C','Release','-V'

      - name: VST3 validator
        run: |
          tools\ci\run-and-report.ps1 -Title "vst3 validator" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-validator.ps1','-BuildDir','build\rack'

      - name: Software OpenGL for screenshots (Mesa llvmpipe, CI only, not shipped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "fetch mesa" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\fetch-mesa.ps1','-TargetDirs','build\rack\tools\rack_snapshot\Release,build\rack\rackapp\Release'

      - name: Faceplates (live spectrum, noise curve, EQ curve)
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "faceplates" -Exe .\build\rack\tools\rack_snapshot\Release\hem_rack_snapshot.exe -ArgList '--out','shots','--scale','0.75'

      - name: Start the real app and capture its window
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "app: SURGEON selected" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rack\rackapp\Release\HEMEliteRack.exe','-Shot','shots\app_surgeon.png','-Select','2'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: THE CLEANER selected" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rack\rackapp\Release\HEMEliteRack.exe','-Shot','shots\app_the_cleaner.png','-Select','1'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: VELVET selected" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rack\rackapp\Release\HEMEliteRack.exe','-Shot','shots\app_velvet.png','-Select','3'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: THE FAMILY selected" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rack\rackapp\Release\HEMEliteRack.exe','-Shot','shots\app_the_family.png','-Select','4'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: vintage chain, ARCHIVE selected" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rack\rackapp\Release\HEMEliteRack.exe','-Shot','shots\app_archive.png','-Select','1','-Vintage'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: vintage chain, FURNACE selected" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rack\rackapp\Release\HEMEliteRack.exe','-Shot','shots\app_furnace.png','-Select','3','-Vintage'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: vintage chain, LOCKDOWN selected" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rack\rackapp\Release\HEMEliteRack.exe','-Shot','shots\app_lockdown.png','-Select','6','-Vintage'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: plate closed, chain still running" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rack\rackapp\Release\HEMEliteRack.exe','-Shot','shots\app_plate_closed.png','-Closed'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: picker cards, DYNAMICS" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rack\rackapp\Release\HEMEliteRack.exe','-Shot','shots\app_picker_dynamics.png','-Picker','2'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: picker cards, EQ" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rack\rackapp\Release\HEMEliteRack.exe','-Shot','shots\app_picker_eq.png','-Picker','1'

      - name: Screenshots as a build artifact (every branch, for checking the plates before a release)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: faceplate-shots
          path: shots/*.png
          if-no-files-found: ignore

      - name: Publish screenshots to the ci-screenshots branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "publish screenshots" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\publish-screenshots.ps1','-Folder','shots'

      - name: Build installer (refuses ASIO code)
        run: |
          tools\ci\run-and-report.ps1 -Title "installer: build" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\build-installer.ps1'

      - name: Verify installer (install, self-test, upgrade, uninstall)
        run: |
          tools\ci\run-and-report.ps1 -Title "installer: verify" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\verify-installer.ps1','-Installer',"$env:HEM_INSTALLER"

      - name: Build the plug-ins-only installer (HEM-Elite-Rack VST3)
        run: |
          tools\ci\run-and-report.ps1 -Title "vst3 installer: build" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\build-vst3-installer.ps1'

      - name: Verify the plug-ins-only installer (silent install, upgrade, side by side with the full one, uninstall)
        run: |
          tools\ci\run-and-report.ps1 -Title "vst3 installer: verify" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\verify-vst3-installer.ps1','-Installer',"$env:HEM_VST3_INSTALLER",'-FullInstaller',"$env:HEM_INSTALLER"

      - name: Source code of this build, as the GPL asks (the rack, The Hybrid Core, the ASIO and VST3 SDK parts)
        run: |
          tools\ci\run-and-report.ps1 -Title "source zip" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\make-source-zip.ps1'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: HEM-Elite-Rack-Setup-${{ env.HEM_VERSION }}
          path: installer/output/*.exe

      - name: Upload plug-ins-only installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: HEM-Elite-Rack-VST3-Setup-${{ env.HEM_VERSION }}
          path: installer/output/HEM-Elite-Rack-VST3-Setup-*.exe

      - name: Publish the plug-ins-only installer at a fixed, versioned address (main only, never overwritten)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "vst3-v$($env:HEM_VERSION)"
          gh release view $tag -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::notice::$tag already published - left untouched (a published installer never changes; bump VERSION for a new one)"
          } else {
            $sha = (Get-FileHash $env:HEM_VST3_INSTALLER -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path $env:HEM_VST3_INSTALLER -Leaf
            $notes = "HEM-Elite-Rack VST3 $($env:HEM_VERSION): the plug-ins only, for DAWs. Installs into Common Files\VST3. Silent install: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART.`n`nSHA-256: $sha`nSource: this repository @ $env:GITHUB_SHA (GPLv3)."
            gh release create $tag $env:HEM_VST3_INSTALLER -R $env:GITHUB_REPOSITORY --title "HEM-Elite-Rack VST3 $($env:HEM_VERSION)" --notes $notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
            Write-Host "::notice::Published $tag : https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$name  SHA-256 $sha"
          }

      - name: Publish GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "release: publish" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\publish-release.ps1'
