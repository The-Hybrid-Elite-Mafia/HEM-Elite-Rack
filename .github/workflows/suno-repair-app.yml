name: HEM Suno Repair app

# Builds the Windows program (tools/suno_repair) and tests the packaged .exe on a test song.
on:
  push:
    branches: [suno-repair-pipeline]
    paths: ['tools/suno_repair/**', 'installer/HEMSunoRepair.iss', '.github/workflows/suno-repair-app.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/suno_repair/requirements.txt pyinstaller

      - name: ffmpeg (for MP3 stems)
        run: |
          Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" tools\suno_repair\

      - name: Package
        working-directory: tools/suno_repair
        run: >
          pyinstaller --noconfirm --clean --windowed --name "HEM Suno Repair"
          --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;."
          --collect-all librosa --collect-all pyloudnorm --collect-data soundfile --collect-submodules anthropic
          --hidden-import jsonschema --hidden-import tkinter --hidden-import PIL.ImageTk --icon ..\..\rackapp\resources\HEMEliteRack.ico
          --add-data "suno_repair\fonts;fonts" --add-data "..\..\rackapp\resources\HEMEliteRack.ico;."
          hem_suno_repair.py

      - name: Test the packaged program on a test song (built-in rules, no API key)
        working-directory: tools/suno_repair
        run: |
          python make_test_stems.py "$env:RUNNER_TEMP\song" --seconds 40
          .\ffmpeg.exe -v error -i "$env:RUNNER_TEMP\song\Guitar.wav" -b:a 320k "$env:RUNNER_TEMP\song\Keys.mp3"
          $p = Start-Process -FilePath "dist\HEM Suno Repair\HEM Suno Repair.exe" -ArgumentList "`"$env:RUNNER_TEMP\song`"","--out","`"$env:RUNNER_TEMP\out`"","--planner","rules" -Wait -PassThru
          Write-Host "exit code $($p.ExitCode)"
          Get-ChildItem "$env:RUNNER_TEMP\out" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          Get-Content "$env:RUNNER_TEMP\out\verification.md"
          $v = Get-Content "$env:RUNNER_TEMP\out\verification.json" | ConvertFrom-Json
          if (-not (Test-Path "$env:RUNNER_TEMP\out\master.wav")) { throw "no master.wav" }
          if ($p.ExitCode -ne 0 -or -not $v.all_pass) { throw "packaged program test failed (exit $($p.ExitCode))" }

      - name: Photograph the real window on Windows (stems pre-picked, then a finished run)
        working-directory: tools/suno_repair
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
          }
          $env:HEM_PRESELECT_STEMS = "$env:RUNNER_TEMP\song"
          $p = Start-Process -FilePath "dist\HEM Suno Repair\HEM Suno Repair.exe" -PassThru
          Start-Sleep -Seconds 25
          Shot "$env:RUNNER_TEMP\window.png"
          Copy-Item "$env:RUNNER_TEMP\window.png" "$env:GITHUB_WORKSPACE\window-preview.png"
          if ($p.HasExited) { throw "the window closed by itself (exit $($p.ExitCode)) - see window-preview.png" }
          $err = Get-Process | Where-Object { $_.MainWindowTitle -like '*Unhandled exception*' -or $_.MainWindowTitle -like '*Error*' }
          if ($err) { throw "an error window is open: $($err.MainWindowTitle)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds | Out-Host

      - name: Installer (Inno Setup)
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Host }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=0.1.$env:GITHUB_RUN_NUMBER" installer\HEMSunoRepair.iss | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-Item installer\output\HEM-Suno-Repair-Setup.exe | Select-Object Name, Length

      - name: Publish the download (release suno-repair-app, pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'suno-repair-app'
          gh release view $tag -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag installer\output\HEM-Suno-Repair-Setup.exe -R $env:GITHUB_REPOSITORY --prerelease --title "HEM Suno Repair" --notes "Windows installer for HEM Suno Repair (pick your stems folder, press RUN)." --target $env:GITHUB_SHA
          } else {
            gh release upload $tag installer\output\HEM-Suno-Repair-Setup.exe -R $env:GITHUB_REPOSITORY --clobber
          }
          if (Test-Path window-preview.png) { gh release upload $tag window-preview.png -R $env:GITHUB_REPOSITORY --clobber }
          if ($LASTEXITCODE -ne 0) { throw "publish failed ($LASTEXITCODE)" }
          Write-Host "::notice::https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/HEM-Suno-Repair-Setup.exe"
